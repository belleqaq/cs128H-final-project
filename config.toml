# ============================================================
#  Brownshock — Game Settings
# ============================================================
#
#  Edit this file to change how the game feels.
#  Save the file, then re-run the game to see your changes:
#
#      docker compose run --rm dev cargo run
#
#  Rules:
#    - Lines starting with # are comments (ignored by the game).
#    - Only change the numbers/letters AFTER the = sign.
#    - If you break something, delete this file and the game
#      will use its built-in defaults.
#
# ============================================================


# ---- Game Speed --------------------------------------------
# How many milliseconds between each game "tick".
# A tick is one step of the world: the player may move,
# the NPC may move, and the screen redraws.
#
#   Lower = faster game.   Higher = slower game.
#   Try:  50 (hectic)   150 (normal)   400 (chill)
#
# Note: the NPC's wait times (below) are auto-scaled to keep
# real-time behaviour roughly the same when you change this.
tick_ms = 150


# ---- Player (@) --------------------------------------------
[player]

# Maximum movement speed, in TILES PER TICK.
# The game caps this at 1.0 — no matter what you put here,
# the player never moves more than one tile per tick.
#   1.0 = one tile every tick (fastest)
#   0.5 = one tile every 2 ticks
#   0.25 = one tile every 4 ticks (slow, stealthy)
speed = 1.0

# How much speed is gained each tick while holding a direction.
# Units: tiles-per-tick added per tick (up to the speed cap).
#   0.3  = ramp up over ~3 ticks (normal)
#   1.0  = reach top speed instantly
#   0.1  = sluggish, takes ~10 ticks to reach top speed
acceleration = 0.3

# How much speed you keep when you flip direction (A -> D or D -> A).
# This is a slider from 0 to 1.
#
#   0.0 = full stop on turn (heavy, strategic)
#   0.5 = keep half speed
#   1.0 = never lose speed on turn (fluid, slippery)
#
# Only affects left/right turns. There is no diagonal movement.
keep_momentum = 1.0

# Per-tick friction multiplier applied when no direction is held
# (or when A and D cancel each other out, SOCD style).
#
#   1.0  = infinite slide, never slows down
#   0.8  = long slide, icy
#   0.6  = normal, noticeable slide (default)
#   0.3  = very quick stop
#   0.0  = instant stop, no slide at all
#
# Each tick with no input, current_speed *= friction.
friction = 0.6


# ---- NPC (the blue "N" that walks around) ------------------
[npc]

# Random wait (in ticks) before each NPC move. The NPC rolls
# a number between wait_min and wait_max and stands still for
# that many ticks before stepping.
#   Small numbers = NPC moves often (harder).
#   Big numbers   = NPC moves rarely (easier).
#
# These are given at the baseline tick rate (tick_ms = 150).
# If you change tick_ms, the game auto-scales these values so
# the NPC still moves at about the same real-time pace.
wait_min = 1
wait_max = 10

# How many tiles the NPC jumps per move.
#   1 = one tile at a time (normal)
#   2 = two-tile jumps (harder to dodge)
move_distance = 1

# What character represents the NPC on screen.
# Must be a single character.  Examples:  "N"  "X"  "!"  "O"
symbol = "N"
