# ============================================================
#  Brownshock — Game Settings
# ============================================================
#
#  Edit this file to change how the game feels.
#  Save the file, then re-run the game to see your changes:
#
#      docker compose run --rm dev cargo run
#
#  Rules:
#    - Lines starting with # are comments (ignored by the game).
#    - Only change the numbers/letters AFTER the = sign.
#    - If you break something, delete this file and the game
#      will use its built-in defaults.
#
# ============================================================


# ---- Game Speed --------------------------------------------
# How many milliseconds between each game step.
#   Lower = faster game.    Higher = slower game.
#   Try:  50 (hectic)  150 (normal)  400 (chill)
tick_ms = 150


# ---- Player (@) --------------------------------------------
[player]

# Your max movement speed, in tiles per second.
#   5  = slow and careful
#   10 = normal
#   20 = very fast
speed = 10

# How quickly you reach max speed when you start moving,
# in tiles per second per second.
#   Big number  (e.g. 100) = almost instant, snappy controls
#   Small number (e.g. 10) = slow ramp-up, feels heavy / icy
#   Try: 50 (normal)  20 (sluggish)  200 (instant)
acceleration = 50

# How much speed you keep when you change direction.
# This is a slider from 0 to 1.
#
#   0.0 = full stop when turning (heavy, strategic gameplay)
#         - 180° turn: lose ALL speed
#         -  90° turn: lose HALF speed
#
#   0.5 = keep some speed (balanced)
#         - 180° turn: keep half
#         -  90° turn: keep 75%
#
#   1.0 = never lose speed (fluid, fast gameplay)
#         - any turn: keep ALL speed
#
# The game uses the angle between your old and new direction
# to decide exactly how much speed to keep. Sharper turns
# lose more speed (unless this is set to 1.0).
keep_momentum = 1.0


# ---- NPC (the blue "N" that walks around) ------------------
[npc]

# Random wait before each move (in game steps).
# The NPC rolls a random number between wait_min and wait_max.
# That number = how many steps it stands still before moving.
#   Small numbers = NPC moves often (harder).
#   Big numbers   = NPC moves rarely (easier).
wait_min = 1
wait_max = 10

# How many tiles the NPC jumps per move.
#   1 = walks one tile at a time (normal).
#   2 = jumps two tiles (harder to dodge).
move_distance = 1

# What character represents the NPC on screen.
# Must be a single character.  Examples:  "N"  "X"  "!"  "O"
symbol = "N"
