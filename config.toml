# Brownshock — config.toml
# Pixel-space tuning (rooms live in ~960×640 world coords).

[window]
width = 1280
height = 720
title = "Brownshock"

# Game-logic tick interval. Smaller = smoother physics.
tick_ms = 16

[player]
max_speed = 32.0       # px per baseline (150ms) tick
acceleration = 600.0   # px/s²
friction = 0.85
stop_friction = 0.5
collision_radius = 18.0
visual_radius = 22.0

[gameplay]
urgency_rate = 0.002
toilet_relief = 0.4
star_relief = 0.15
goal_count = 3
qte_length = 4
qte_time_per_key = 1.0
poop_rounds = 3
