# Brownshock — config.toml
# Phase 1: movement tuning only.

[window]
width = 1280
height = 720
title = "Brownshock"

tick_ms = 8

[player]
max_speed = 1.0
acceleration = 13.33   # grid/s²
friction = 0.85
stop_friction = 0.5
radius = 0.20          # Phase 5.5: shrunk from 0.35 (1-cell-corridor passing)
repulsion_power = 2.0
repulsion_range = 0.30 # Phase 7-prereq: scaled from 0.5 (linear with radius shrink)
repulsion_push = 0.09  # Phase 7-prereq: scaled from 0.15
max_turn_rate = 3.14159265 # Phase 7-prereq: π rad/s = half-rotation per second

[gameplay]
urgency_rate = 0.002
toilet_relief = 0.4
star_relief = 0.15
goal_count = 3
qte_length = 4
qte_time_per_key = 1.0
poop_rounds = 3
