<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brownshock — Config</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="config-app">
    <nav class="nav">
      <a href="/">&#8592; Game</a>
      <span class="nav-title">Live Config Editor</span>
      <span id="status" class="status"></span>
    </nav>

    <p class="hint">
      Drag any slider or type a number — the running game reacts instantly.
      Number inputs accept any value; sliders are range-limited.
    </p>

    <!-- Game speed -->
    <section class="cfg-group">
      <h3>Game Speed</h3>
      <div class="field">
        <label for="tick_ms">Tick interval (ms)</label>
        <input type="range" id="tick_ms" min="20" max="500" step="10" />
        <input type="number" class="num-input" data-for="tick_ms" step="10" />
      </div>
    </section>

    <!-- Player -->
    <section class="cfg-group">
      <h3>Player (@)</h3>
      <div class="field">
        <label for="player_max_speed">Max speed (tiles/tick)</label>
        <input type="range" id="player_max_speed" min="0.05" max="3" step="0.05" />
        <input type="number" class="num-input" data-for="player_max_speed" step="0.05" />
      </div>
      <div class="field">
        <label for="player_acceleration">Acceleration (tiles/tick²)</label>
        <input type="range" id="player_acceleration" min="0.01" max="2" step="0.01" />
        <input type="number" class="num-input" data-for="player_acceleration" step="0.01" />
      </div>
      <div class="field">
        <label for="player_friction">Friction (per-tick multiplier)</label>
        <input type="range" id="player_friction" min="0" max="1" step="0.01" />
        <input type="number" class="num-input" data-for="player_friction" step="0.01" />
      </div>
    </section>

    <!-- NPC -->
    <section class="cfg-group">
      <h3>NPC</h3>
      <div class="field">
        <label for="npc_hold_min">Hold min (ticks)</label>
        <input type="range" id="npc_hold_min" min="0" max="80" step="1" />
        <input type="number" class="num-input" data-for="npc_hold_min" step="1" />
      </div>
      <div class="field">
        <label for="npc_hold_max">Hold max (ticks)</label>
        <input type="range" id="npc_hold_max" min="0" max="80" step="1" />
        <input type="number" class="num-input" data-for="npc_hold_max" step="1" />
      </div>
      <div class="field">
        <label for="npc_symbol">Symbol</label>
        <input type="text" id="npc_symbol" maxlength="1" value="N" />
      </div>
    </section>

    <!-- Actions -->
    <div class="cfg-actions">
      <button id="btn-defaults">Reset to defaults</button>
      <button id="btn-save">Save to config.toml</button>
    </div>
  </div>
  <script src="/config.js"></script>
</body>
</html>
