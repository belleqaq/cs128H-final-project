[package]
name = "brownshock"
version = "0.1.0"
edition = "2021"

[dependencies]
# Terminal-only backend: skips OpenGL (glow) and WASM code paths, both of
# which have upstream bugs in bracket-terminal 0.8.7. The game renders
# directly in the TTY via crossterm.
bracket-lib = { version = "0.8", default-features = false, features = ["crossterm"] }
